<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>倍数・約数迷路 | TT-sensei</title><style>

.start{position:relative;overflow:hidden;min-height:calc(100dvh - 70px);background:linear-gradient(145deg,#173e2e,#071a12);color:#fff}.start:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 18%,#4bd59644,transparent 34%),radial-gradient(circle at 85% 16%,#f1cf6940,transparent 28%)}.startinner{position:relative;z-index:2;min-height:calc(100dvh - 70px);display:grid;grid-template-columns:1.25fr .75fr;gap:18px;padding:clamp(24px,5vw,58px)}.copy{display:flex;flex-direction:column;justify-content:center;max-width:720px}.eyebrow{display:inline-block;align-self:flex-start;border:1px solid #ffffff33;background:#ffffff12;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:900}.start h1{font-size:clamp(48px,7vw,88px);line-height:.97;letter-spacing:-.06em;margin:18px 0}.start h1 em{font-style:normal;color:#8ee4b8}.lead{color:#ffffffc9;line-height:1.7;font-weight:700;font-size:clamp(15px,2vw,19px)}.cards{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.card{padding:11px 14px;border:1px solid #ffffff2b;background:#ffffff0d;border-radius:15px}.card b{display:block}.card small{color:#ffffffa8}.title{font-size:12px;font-weight:900;margin-top:8px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.mode{border:2px solid #ffffff33;background:#ffffff0d;color:#fff;text-align:left;border-radius:16px;padding:13px;cursor:pointer}.mode strong{display:block}.mode small{color:#ffffffa8}.mode.selected{border-color:#75dbaa;background:#4bc58b2b}.chars{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.char{width:50px;height:50px;border:1px solid #ffffff2b;background:#ffffff0d;border-radius:14px;padding:3px;cursor:pointer}.char.selected{border:2px solid #75dbaa}.char img{width:100%;height:100%;object-fit:contain}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.startbtn{border:0;background:linear-gradient(135deg,#51ce95,#269568);color:#fff;padding:17px 26px;border-radius:17px;font-size:19px;font-weight:950;cursor:pointer;box-shadow:0 7px 0 #176847}.startart{display:grid;place-items:center;position:relative;min-height:280px}.portal{position:absolute;width:min(25vw,280px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#76e3ad35,#309d6c10 48%,transparent 70%);box-shadow:0 0 45px #50d69722}.navi{height:min(220px,30vh);max-width:62%;object-fit:contain;filter:drop-shadow(0 14px 12px #0005)}.speech{position:absolute;right:2%;top:9%;background:#fff;color:var(--dark);padding:10px 13px;border-radius:17px 17px 4px 17px;font-weight:900;font-size:13px;box-shadow:0 10px 22px #0004}
.game{padding:12px}.head{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:3px 4px 10px}.label{font-size:12px;color:var(--muted);font-weight:900}.question{font-size:clamp(23px,3vw,37px);font-weight:950}.sub{font-size:12px;color:var(--muted);font-weight:800}.progress{text-align:center}.bar{height:12px;width:min(360px,30vw);background:#e7f1ec;border-radius:99px;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:var(--g);width:0;transition:width .2s}.status{text-align:right}.status strong{display:block}.status small{color:var(--muted);font-weight:800}.tools{display:flex;justify-content:flex-end;gap:7px;margin-bottom:8px}.mazeShell{padding:8px;border:3px solid #c8e1d5;border-radius:28px;background:#dceee5}.scene{position:relative;height:min(70vh,700px);min-height:520px;border-radius:22px;overflow:hidden;background:#183829;isolation:isolate}.sceneBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(.98);transform:scale(1.03)}.sceneTint{position:absolute;inset:0;background:linear-gradient(180deg,#071a1250 0%,#071a1215 46%,#071a1260 100%),radial-gradient(circle at 50% 52%,transparent 0 32%,#071a1235 78%,#071a1270);z-index:1;pointer-events:none}.route{position:absolute;inset:13% 18%;z-index:3}.route svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.routePath{fill:none;stroke:#ecfff5aa;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.routePathDone{fill:none;stroke:#63dba7;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.node{position:absolute;width:24px;height:24px;border-radius:50%;background:#ffffffc8;border:3px solid #214c3a;transform:translate(-50%,-50%);box-shadow:0 3px 8px #06150d66}.node.done{background:#78e0b1;border-color:#fff}.node.next{background:#fff1b1;border-color:#fff}.node.goal{width:34px;height:34px;background:#fff;border-color:#fff}.node.goal:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#d49e35;font-size:17px}.hero{position:absolute;width:72px;height:72px;border-radius:50%;transform:translate(-50%,-72%);z-index:7;background:#ffffffd8;border:4px solid #fff;box-shadow:0 0 0 7px #63dba73d,0 8px 20px #06150d55;display:grid;place-items:center;transition:left .28s,top .28s}.hero img{width:100%;height:100%;object-fit:contain}.sceneChip{position:absolute;z-index:8;top:14px;left:14px;background:#fffffff2;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:950}.areaChip{right:14px;left:auto}.choice{position:absolute;z-index:9;width:112px;height:112px;border:4px solid #fff;background:#fffffff2;border-radius:24px;box-shadow:0 7px 0 #9dc4b2,0 12px 24px #071a1240;display:grid;place-items:center;color:var(--dark);font-size:35px;font-weight:950;cursor:pointer}.choice small{display:block;font-size:10px;color:var(--muted);font-weight:850}.up{left:50%;top:3%;transform:translateX(-50%)}.right{right:2%;top:50%;transform:translateY(-50%)}.down{left:50%;bottom:3%;transform:translateX(-50%)}.left{left:2%;top:50%;transform:translateY(-50%)}.bottom{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 3px}.hint{color:var(--muted);font-weight:850}.overlay{position:fixed;inset:0;background:#05140eb8;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:100}.overlaybox{width:min(680px,100%);background:#fff;border:2px solid var(--line);border-radius:28px;padding:27px;text-align:center;box-shadow:0 30px 80px #0005}.overlaybox h2{font-size:clamp(30px,5vw,46px);margin:7px 0}.overlaybox p{color:var(--muted);line-height:1.7;font-weight:750}.preview{height:160px}.preview img{height:100%;max-width:100%;object-fit:contain}.go{border:0;background:var(--g);color:#fff;border-radius:15px;padding:15px 23px;font-weight:950;font-size:17px;cursor:pointer}.result{padding:35px 20px;text-align:center}.result h2{font-size:clamp(40px,6vw,60px);margin:7px 0}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px}.stat{min-width:125px;border:2px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:27px}.stat small{color:var(--muted);font-weight:850}.learn{max-width:720px;margin:15px auto;border:2px solid var(--line);border-radius:19px;padding:15px;text-align:left;background:#fbfffd}.learn h3{margin:0 0 8px}.learn p{margin:7px 0;color:var(--muted);font-weight:750}.badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px}.badge{width:160px;border:2px solid var(--line);border-radius:18px;padding:13px;background:#fbfffd}.badgeIcon{width:78px;height:78px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:5px solid #fff;box-shadow:0 0 0 2px var(--g);font-size:30px}.badge.locked{opacity:.38;filter:grayscale(1)}.badge b{display:block;margin-top:7px;font-size:12px}.resultActions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}@media(max-width:900px){.startinner{grid-template-columns:1fr}.startart{min-height:190px;order:-1}.navi{height:150px}.head{grid-template-columns:1fr auto}.progress{grid-column:1/-1}.bar{width:min(520px,80vw);margin:auto}.status{display:none}.scene{min-height:500px;height:66vh}.route{inset:16% 20%}.choice{width:96px;height:96px;min-width:96px;min-height:96px;font-size:29px}.hero{width:62px;height:62px}}@media(max-width:560px){.app{padding:7px}.startinner{padding:18px 14px}.start h1{font-size:48px}.startart{min-height:135px}.navi{height:125px}.speech{font-size:11px;top:4%}.chars{gap:5px}.char{width:46px;height:46px}.modes{grid-template-columns:1fr}.scene{min-height:450px;height:68vh}.route{inset:19% 23%}.choice{width:74px;height:74px;min-width:74px;min-height:74px;border-width:3px;border-radius:18px;font-size:25px}.choice small{font-size:9px}.hero{width:54px;height:54px}.node{width:18px;height:18px}.node.goal{width:28px;height:28px}.sceneChip{top:10px;left:10px;padding:6px 9px;font-size:10px}.areaChip{right:10px;left:auto}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="brandmark">➗</div><div>倍数・約数迷路</div></div><button id="soundBtn">🔊 音ON</button></header>
<section id="start" class="panel start"><div class="startinner"><div class="copy"><span class="eyebrow">NAVI CHARACTER ADVENTURE</span><h1>数字の道を<br><em>すすめ！</em></h1><p class="lead">4つの数字から、条件に合う数字を見つけよう。正解するたびに、ナビキャラと冒険ルートが先へ進むよ。</p><div class="cards"><div class="card"><b>12ステップ</b><small>森 → 洞窟 → 遺跡</small></div><div class="card"><b>4択</b><small>正しい数字を選ぶ</small></div><div class="card"><b>4問ごとに面チェンジ</b><small>面の数字は4問固定</small></div></div><div class="title">あそびかた</div><div class="modes"><button class="mode selected" data-mode="multiple"><strong>倍数をさがす</strong><small>○の倍数を選ぼう</small></button><button class="mode" data-mode="divisor"><strong>約数をさがす</strong><small>○の約数を選ぼう</small></button></div><div class="title">ナビキャラ</div><div class="chars" id="chars"></div><div class="actions"><button id="startBtn" class="startbtn">冒険をはじめる ▶</button></div></div><div class="startart"><div class="portal"></div><img id="startNavi" class="navi" alt="ナビキャラ"><div class="speech">いっしょに<br>進もう！</div></div></div></section>
<section id="game" class="panel game hidden"><div class="head"><div><div class="label" id="stageLabel"></div><div class="question" id="question"></div><div class="sub" id="stepText"></div></div><div class="progress"><div class="sub">ぼうけんの進み具合</div><div class="bar"><span id="progressBar"></span></div></div><div class="status"><strong id="statsText">正解 0　まちがい 0</strong><small id="timeText">0秒</small></div></div><div class="tools"><button id="pauseBtn" class="tool">⏸ ひとやすみ</button></div><div class="mazeShell"><div id="scene" class="scene"><img id="sceneBg" class="sceneBg" alt="ファンタジーの背景"><div class="sceneTint"></div><div id="route" class="route"></div><div id="hero" class="hero"><img id="heroImg" alt="ナビキャラ"></div><div id="stageChip" class="sceneChip"></div><div id="areaChip" class="sceneChip areaChip"></div><button class="choice up" data-dir="U" aria-label="上の数字"></button><button class="choice right" data-dir="R" aria-label="右の数字"></button><button class="choice down" data-dir="D" aria-label="下の数字"></button><button class="choice left" data-dir="L" aria-label="左の数字"></button></div></div><div class="bottom"><div class="hint" id="hint">4つの数字から、条件に合う数字を選ぼう。</div><button id="quitBtn" class="secondary">トップへ</button></div></section>
<section id="result" class="panel result hidden"><div class="preview"><img id="resultNavi" alt="ナビキャラ"></div><h2 id="resultTitle">冒険クリア！</h2><p id="resultLead"></p><div class="stats"><div class="stat"><b id="rCorrect">0</b><small>正解</small></div><div class="stat"><b id="rWrong">0</b><small>まちがい</small></div><div class="stat"><b id="rAccuracy">0%</b><small>正解率</small></div><div class="stat"><b id="rTime">0秒</b><small>タイム</small></div></div><div class="learn"><h3>きょうの学び</h3><p id="learnText"></p></div><div class="badges" id="badges"></div><div class="resultActions"><button id="againBtn" class="go">もう一度</button><button id="homeBtn" class="secondary">トップへ</button></div></section>
<div id="pause" class="overlay hidden"><div class="overlaybox"><div class="preview"><img id="pauseNavi" alt="ナビキャラ"></div><h2>ひとやすみ</h2><p>冒険はここで待っています。</p><button id="resumeBtn" class="go">冒険にもどる</button></div></div>
<script>
const NAVI='https://tt-sensei.github.io/navi-character-/assets/characters/',BG='https://tt-sensei.github.io/navi-character-/assets/fantasy/backgrounds/';const CHARS=[['riku','りく'],['sora','そら'],['kai','かい'],['saku','さく'],['tsuki','つき'],['nami','なみ']];const AREAS=[['🌲','みどりの森','forest','1〜4'],['🕳️','ひみつの洞窟','cave','5〜8'],['🏛️','古代遺跡','ruins','9〜12']];const TARGETS={multiple:[3,4,5,6,7,8,9],divisor:[12,18,20,24,28,30,36,40,42,48]};const BADGES=[['multiple-clear','🌟','倍数の冒険者','倍数モードをクリア'],['multiple-master','🏆','倍数マスター','倍数モードでまちがいなし'],['divisor-clear','🔑','約数の冒険者','約数モードをクリア'],['divisor-master','💎','約数マスター','約数モードでまちがいなし']];const $=id=>document.getElementById(id),charPath=n=>n==='kai'?'https://tt-sensei.github.io/navi-character-/assets/web/characters/kai/fullbody/quiet-victory.webp':NAVI+n+'/fullbody/complete.png';const state={mode:'multiple',char:'riku',step:0,correct:0,wrong:0,start:0,pausedAt:0,route:[],target:null,sound:true,pauseStamp:0};let audioCtx;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function beep(ok=true){if(!state.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=ok?660:180;g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.12);o.stop(audioCtx.currentTime+.13)}catch(e){}}function good(n){return Number.isInteger(n)&&n>0&&(state.mode==='multiple'?n%state.target===0:state.target%n===0)}
function chooseTarget(){const p=TARGETS[state.mode];let n=p[rnd(0,p.length-1)];while(p.length>1&&n===state.target)n=p[rnd(0,p.length-1)];state.target=n}
function getCorrectValue(){if(state.mode==='multiple'){const max=Math.max(2,Math.floor(72/state.target));return state.target*rnd(1,max)}const d=[];for(let n=1;n<=state.target;n++)if(state.target%n===0)d.push(n);return d[rnd(0,d.length-1)]}
function getDistractor(used){let n;do{n=state.mode==='multiple'?rnd(2,72):rnd(2,Math.max(12,state.target+10))}while(used.has(n)||good(n));return n}
function choices(){const dirs=['U','R','D','L'],used=new Set(),v=Array(4),correct=getCorrectValue(),ci=rnd(0,3);v[ci]=correct;used.add(correct);for(let i=0;i<4;i++){if(i===ci)continue;const d=getDistractor(used);used.add(d);v[i]=d}return dirs.map((dir,i)=>({dir,value:v[i],ok:i===ci}))}
function makeRoute(){return [[14,78],[25,66],[39,72],[52,58],[67,68],[78,55],[64,43],[48,48],[34,37],[46,24],[62,31],[76,20],[88,29]].map(p=>({x:p[0],y:p[1]}))}
function area(){return state.step<4?0:state.step<8?1:2}
function renderRoute(){const r=$('route');r.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="nodes"></div>';const svg=r.querySelector('svg'),nodes=r.querySelector('#nodes'),all=state.route.map(p=>p.x+','+p.y).join(' '),done=state.route.slice(0,state.step+1).map(p=>p.x+','+p.y).join(' ');svg.innerHTML='<polyline class="routePath" points="'+all+'"></polyline><polyline class="routePathDone" points="'+done+'"></polyline>';state.route.forEach((p,i)=>{const n=document.createElement('div');n.className='node '+(i<=state.step?'done ':'')+(i===state.step+1?'next ':'')+(i===state.route.length-1?'goal':'');n.style.left=p.x+'%';n.style.top=p.y+'%';nodes.appendChild(n)});const p=state.route[state.step];$('hero').style.left=p.x+'%';$('hero').style.top=p.y+'%'}
function render(){const a=AREAS[area()];$('sceneBg').src=BG+a[2]+'.png';$('stageChip').textContent=a[0]+' '+a[1];$('areaChip').textContent=a[3];$('stageLabel').textContent=a[0]+' '+a[1];$('question').textContent=state.target+' の'+(state.mode==='multiple'?'倍数':'約数')+'をさがそう';$('stepText').textContent=(state.step+1)+' / 12';$('progressBar').style.width=(state.step/12*100)+'%';$('hint').textContent=state.step<4?'🌲 森を進もう！':state.step<8?'🕳️ 洞窟の奥へ進もう！':'🏛️ 遺跡のゴールをめざそう！';renderRoute();const map={U:'.up',R:'.right',D:'.down',L:'.left'};choices().forEach(c=>{const b=document.querySelector(map[c.dir]);b.innerHTML='<span>'+c.value+'</span><small>'+({U:'上',R:'右',D:'下',L:'左'}[c.dir])+'</small>';b.dataset.ok=c.ok?'1':'0'});updateStats()}
function updateStats(){$('statsText').textContent='正解 '+state.correct+'　まちがい '+state.wrong;$('timeText').textContent=Math.floor((Date.now()-state.start-(state.pausedAt||0))/1000)+'秒'}
function startGame(){state.step=0;state.correct=0;state.wrong=0;state.route=makeRoute();state.start=Date.now();state.pausedAt=0;state.pauseStamp=0;chooseTarget();$('start').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');$('heroImg').src=charPath(state.char);$('pauseNavi').src=charPath(state.char);$('resultNavi').src=charPath(state.char);window.scrollTo({top:0,behavior:'instant'});render()}
function finish(){const total=state.correct+state.wrong,acc=total?Math.round(state.correct/total*100):100,t=Math.floor((Date.now()-state.start-(state.pausedAt||0))/1000);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('rCorrect').textContent=state.correct;$('rWrong').textContent=state.wrong;$('rAccuracy').textContent=acc+'%';$('rTime').textContent=t+'秒';$('resultTitle').textContent=state.wrong?'冒険クリア！':'完璧！';$('resultLead').textContent=state.mode==='multiple'?'倍数の道を12問クリアしました。':'約数の道を12問クリアしました。';$('learnText').textContent=state.mode==='multiple'?'同じ面では同じ数字の倍数を4問続けて探しました。':'同じ面では同じ数字の約数を4問続けて探しました。';saveBadges();renderBadges()}
function saveBadges(){const p=state.mode==='multiple'?'multiple':'divisor';localStorage.setItem('bai-yaku-'+p+'-clear','1');if(state.wrong===0)localStorage.setItem('bai-yaku-'+p+'-master','1')}function renderBadges(){$('badges').innerHTML=BADGES.map(b=>'<div class="badge '+(localStorage.getItem('bai-yaku-'+b[0])?'':'locked')+'"><div class="badgeIcon">'+b[1]+'</div><b>'+b[2]+'</b><small>'+b[3]+'</small></div>').join('')}
function goHome(){$('game').classList.add('hidden');$('result').classList.add('hidden');$('start').classList.remove('hidden');window.scrollTo({top:0,behavior:'instant'})}function pause(){if($('pause').classList.contains('hidden')){$('pause').classList.remove('hidden');state.pauseStamp=Date.now()}}function resume(){if(state.pauseStamp){state.pausedAt+=Date.now()-state.pauseStamp;state.pauseStamp=0}$('pause').classList.add('hidden')}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.mode=b.dataset.mode});CHARS.forEach(c=>{const b=document.createElement('button');b.className='char'+(c[0]===state.char?' selected':'');b.innerHTML='<img src="'+charPath(c[0])+'" alt="'+c[1]+'">';b.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.char=c[0];$('startNavi').src=charPath(c[0])};$('chars').appendChild(b)});$('startNavi').src=charPath(state.char);
$('startBtn').onclick=startGame;$('pauseBtn').onclick=pause;$('resumeBtn').onclick=resume;$('quitBtn').onclick=goHome;$('againBtn').onclick=startGame;$('homeBtn').onclick=goHome;$('soundBtn').onclick=()=>{state.sound=!state.sound;$('soundBtn').textContent=state.sound?'🔊 音ON':'🔇 音OFF'};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(!$('pause').classList.contains('hidden'))return;if(b.dataset.ok==='1'){beep(true);state.correct++;state.step++;if(state.step>=12){finish();return}if(state.step%4===0)chooseTarget();render()}else{beep(false);state.wrong++;$('hint').textContent='その数字は条件に合わないよ。もう一度、4つの数字から選んでみよう！';updateStats();setTimeout(()=>{if(!$('game').classList.contains('hidden'))$('hint').textContent=state.step<4?'🌲 森を進もう！':state.step<8?'🕳️ 洞窟の奥へ進もう！':'🏛️ 遺跡のゴールをめざそう！'},1300)}});document.addEventListener('keydown',e=>{const m={ArrowUp:'U',ArrowRight:'R',ArrowDown:'D',ArrowLeft:'L'};if(m[e.key]&&!$('game').classList.contains('hidden'))document.querySelector('.'+({U:'up',R:'right',D:'down',L:'left'}[m[e.key]])).click()});setInterval(updateStats,1000);renderBadges();
</script></main></body></html>
