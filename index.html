<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3fbf7">
<title>倍数・約数迷路 | TT-sensei</title>
<style>
:root{--bg:#f3fbf7;--ink:#18332a;--muted:#668177;--line:#d8ebe2;--accent:#37a879;--accent2:#287f5c;--soft:#e4f6ed;--path:#fff;--visited:#d9f0e4;--wall:#b7d9c9;--shadow:0 10px 30px rgba(24,51,42,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(#f9fdfb,var(--bg))}button{font:inherit;touch-action:manipulation}.app{width:min(1220px,100%);margin:auto;padding:16px;min-height:100dvh}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;border:2px solid #cbe8da;font-size:21px}.ghost,.secondary{border:2px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:14px;font-weight:900;cursor:pointer}.panel{background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.intro{padding:42px;display:flex;flex-direction:column;justify-content:center}.eyebrow{display:inline-flex;align-self:flex-start;background:var(--soft);color:var(--accent2);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:12px}h1{font-size:clamp(34px,5vw,56px);line-height:1.08;margin:0 0 14px;letter-spacing:-.04em}.lead{color:var(--muted);font-weight:650;line-height:1.75;margin:0 0 24px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode-card{border:2px solid var(--line);background:#fff;border-radius:20px;padding:20px;text-align:left;cursor:pointer}.mode-card:hover{border-color:#9fd2ba;transform:translateY(-2px)}.mode-card strong{display:block;font-size:21px;margin-bottom:6px}.mode-card span{font-size:13px;color:var(--muted)}.hero-art{min-height:310px;position:relative;overflow:hidden;background:linear-gradient(150deg,#eaf8f1,#fff)}.hero-navi{position:absolute;inset:10px;display:grid;place-items:center}.hero-navi img{height:290px;max-width:75%;object-fit:contain;filter:drop-shadow(0 14px 12px rgba(24,51,42,.12))}.bubble{position:absolute;right:20px;top:20px;background:#fff;border:2px solid var(--line);border-radius:17px;padding:10px 13px;font-weight:900;z-index:2}.screen{padding:18px}.game-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:2px 4px 16px}.label,.progress-label{font-size:13px;color:var(--muted);font-weight:800}.question{font-size:clamp(24px,3vw,36px);font-weight:950}.progress-wrap{text-align:center}.progress{width:min(320px,28vw);height:13px;background:#eaf2ee;border:1px solid #dcebe4;border-radius:999px;overflow:hidden;margin-top:6px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#72cda1,var(--accent));border-radius:999px;transition:.2s}.status{text-align:right}.status strong{display:block;font-size:19px}.status span{font-size:12px;color:var(--muted)}
.maze-shell{position:relative;background:#e8f5ef;border:3px solid #c6e2d3;border-radius:30px;padding:14px;overflow:hidden}.maze-shell:before{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.72);border-radius:23px;pointer-events:none;z-index:1}.maze{position:relative;display:grid;grid-template-columns:minmax(150px,1fr) minmax(300px,430px) minmax(150px,1fr);grid-template-rows:minmax(120px,1fr) minmax(250px,1fr) minmax(120px,1fr);gap:12px;min-height:590px;padding:28px;background-size:cover;background-position:center;background-repeat:no-repeat;border-radius:22px;overflow:hidden}.maze:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(247,253,250,.66),rgba(231,247,239,.72));pointer-events:none;z-index:0}.trail{position:absolute;inset:50px;pointer-events:none;z-index:1}.trail-dot{position:absolute;width:20px;height:20px;border-radius:50%;background:#a9d8c0;border:3px solid #fff;box-shadow:0 2px 5px rgba(24,51,42,.12);transform:translate(-50%,-50%);z-index:1}.trail-dot.current{width:27px;height:27px;background:var(--accent);border-width:4px}.trail-line{position:absolute;height:8px;background:#b9dfcc;border-radius:99px;transform-origin:left center;z-index:0}.choice{width:min(100%,205px);aspect-ratio:1;border:4px solid #aacfbf;background:rgba(255,255,255,.94);border-radius:24px;box-shadow:0 9px 0 #c3ded1,0 14px 22px rgba(24,51,42,.08);font-size:clamp(38px,5vw,62px);font-weight:950;color:var(--ink);cursor:pointer;position:relative;z-index:3}.choice:after{content:"";position:absolute;inset:-9px;border:2px solid transparent;border-radius:31px;transition:.15s}.choice:hover:after{border-color:#a4d4bd}.choice:active{transform:translateY(5px);box-shadow:0 3px 0 #c3ded1}.choice.empty{visibility:hidden;pointer-events:none}.choice.up{grid-column:2;grid-row:1}.choice.left{grid-column:1;grid-row:2}.choice.right{grid-column:3;grid-row:2}.choice.down{grid-column:2;grid-row:3}.center{grid-column:2;grid-row:2;display:grid;place-items:center;position:relative;z-index:3}.navi-stage{width:min(260px,80%);height:min(330px,95%);display:grid;place-items:end center;position:relative}.navi-stage:after{content:"";position:absolute;bottom:3%;left:8%;right:8%;height:22px;background:rgba(24,51,42,.12);border-radius:50%;filter:blur(5px)}.navi-stage img{max-width:100%;max-height:100%;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 12px 12px rgba(24,51,42,.13));transition:transform .22s}.move-up img{transform:translateY(-12px)}.move-down img{transform:translateY(12px)}.move-left img{transform:translateX(-12px)}.move-right img{transform:translateX(12px)}.mode-chip{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;color:var(--accent2);z-index:5;white-space:nowrap}.bottom-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 4px 0}.hint{color:var(--muted);font-weight:750;font-size:14px}.hidden{display:none!important}.result{text-align:center;padding:44px}.result-badge{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#fff8de;border:4px solid #f3cf70;font-size:48px}.result h2{font-size:48px;margin:10px 0}.result p{color:var(--muted);font-weight:750}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px}.stat{min-width:130px;padding:14px 18px;border:2px solid var(--line);border-radius:18px;background:#fbfffd}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted);font-weight:800}.primary{border:0;background:var(--accent);color:#fff;padding:14px 19px;border-radius:15px;font-weight:950;cursor:pointer}.badge-note{margin:18px auto;padding:12px 16px;max-width:620px;background:var(--soft);border:2px solid #cbe8da;border-radius:18px;font-weight:900}.badge-note span{color:var(--accent2)}.celebrate{animation:celebrate .55s ease}.wrong{animation:shake .25s ease}.flash{border-color:#55b989!important;box-shadow:0 0 0 7px rgba(55,168,121,.13),0 9px 0 #b9dccb!important}@keyframes celebrate{45%{transform:scale(1.06)}100%{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(max-width:850px){.app{padding:12px}.hero{grid-template-columns:1fr}.hero-art{min-height:230px}.intro{padding:28px}.game-header{grid-template-columns:1fr auto}.progress-wrap{grid-column:1/-1;grid-row:2}.progress{width:min(480px,75vw);margin:auto}.status{display:none}.maze{grid-template-columns:minmax(90px,1fr) minmax(190px,300px) minmax(90px,1fr);grid-template-rows:100px minmax(190px,1fr) 100px;min-height:500px;padding:20px}.maze-shell{padding:9px}.choice{border-width:3px;border-radius:20px}.navi-stage{height:260px}.trail{inset:38px}}
@media(max-width:560px){.app{padding:8px}.topbar{margin-bottom:8px}.brand-mark{width:38px;height:38px}.intro{padding:22px}.mode-grid{grid-template-columns:1fr}.hero-art{min-height:205px}.hero-navi img{height:190px}.screen{padding:8px}.maze{grid-template-columns:72px minmax(100px,1fr) 72px;grid-template-rows:80px minmax(155px,1fr) 80px;min-height:420px;padding:14px;gap:6px}.choice{width:68px;font-size:31px;border-radius:16px;box-shadow:0 5px 0 #c3ded1,0 8px 13px rgba(24,51,42,.07)}.navi-stage{height:205px}.trail{inset:28px}.trail-dot{width:14px;height:14px;border-width:2px}.trail-dot.current{width:20px;height:20px}.bottom-row{flex-direction:column;align-items:stretch}.result{padding:30px 18px}.result h2{font-size:40px}}
@media(min-width:851px) and (max-height:800px){.maze{min-height:500px;grid-template-rows:100px 220px 100px}.navi-stage{height:250px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body><main class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">∮</div><span>倍数・約数迷路</span></div><button class="ghost" id="homeBtn">ホーム</button></header>
<section id="homeScreen"><div class="hero"><div class="panel intro"><span class="eyebrow">小学4〜5年生向け　算数ミニゲーム</span><h1>数字を見て、<br>道をえらぼう。</h1><p class="lead">お題に合う数字を見つけたら、その方向へ一歩。<br>通った道を残しながら、ナビキャラクターとゴールを目指そう！</p><div class="mode-grid"><button class="mode-card" data-mode="multiple"><strong>倍数を進もう</strong><span>「6の倍数」などを見つける</span></button><button class="mode-card" data-mode="divisor"><strong>約数を進もう</strong><span>「12の約数」などを見つける</span></button></div></div><div class="panel hero-art"><div class="bubble">道をつくって進もう！</div><div class="hero-navi"><img id="heroNavi" alt="ナビキャラクター"></div></div></div></section>
<section id="gameScreen" class="panel screen hidden"><div class="game-header"><div><div class="label">今回のお題</div><div class="question" id="questionText"></div></div><div class="progress-wrap"><div class="progress-label" id="progressText">ゴールまで あと10</div><div class="progress"><span id="progressBar"></span></div></div><div class="status"><strong id="characterName"></strong><span id="stageText">ステージ 1</span></div></div><div class="maze-shell"><div class="maze" id="maze"><div class="trail" id="trail"></div><button class="choice up" data-direction="up" aria-label="上へ"></button><button class="choice left" data-direction="left" aria-label="左へ"></button><div class="center"><div class="mode-chip" id="modeChip"></div><div class="navi-stage" id="naviStage"><img id="navi" alt="ナビキャラクター"></div></div><button class="choice right" data-direction="right" aria-label="右へ"></button><button class="choice down" data-direction="down" aria-label="下へ"></button></div></div><div class="bottom-row"><div class="hint" id="feedback">お題に合う数字をタップしよう。</div><button class="secondary" id="quitBtn">ゲームをやめる</button></div></section>
<section id="resultScreen" class="panel result hidden"><div class="result-badge">🎉</div><h2>クリア！</h2><p id="resultMessage"></p><div class="stats"><div class="stat"><strong id="correctCount">0</strong><span>正解</span></div><div class="stat"><strong id="wrongCount">0</strong><span>まちがい</span></div><div class="stat"><strong id="timeCount">0秒</strong><span>クリアタイム</span></div></div><div class="badge-note" id="badgeNote"></div><div><button class="primary" id="againBtn">もう一度</button><button class="secondary" id="resultHomeBtn">ホームへ</button></div></section>
</main>
<script>
const NAVI_BASE='https://tt-sensei.github.io/navi-character-/assets/characters';
const FANTASY_BG_BASE='https://tt-sensei.github.io/navi-character-/assets/fantasy/backgrounds';
const FANTASY_BACKGROUNDS=['cave.png','forest.png','grassland.png','riverbank.png','ruins.png','sea.png','sky-island.png','town.png','training-ground.png','volcano.png'];
const CHARACTERS=[['riku','りく'],['sora','そら'],['kai','かい'],['saku','さく'],['tsuki','つき'],['nami','なみ']].map(([id,name])=>({id,name}));
const CONFIG={multiple:{label:'倍数',targets:[3,4,6,7,8,9]},divisor:{label:'約数',targets:[12,15,18,20,24]}};
const state={mode:'multiple',target:6,stepsTotal:10,stepsLeft:10,correct:0,wrong:0,start:0,char:CHARACTERS[0],pending:false,path:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const screens={home:$('#homeScreen'),game:$('#gameScreen'),result:$('#resultScreen')};
const isCorrect=n=>state.mode==='multiple'?n>0&&n%state.target===0:n>0&&state.target%n===0;
function naviUrl(id,pose){return `${NAVI_BASE}/${id}/fullbody/${pose}.png`}
function setNavi(pose='waving'){$('#navi').src=naviUrl(state.char.id,pose);$('#heroNavi').src=naviUrl(state.char.id,'waving')}
function setFantasyBackground(){const file=FANTASY_BACKGROUNDS[Math.floor(Math.random()*FANTASY_BACKGROUNDS.length)];$('#maze').style.backgroundImage=`url("${FANTASY_BG_BASE}/${file}")`}
function showScreen(name){Object.values(screens).forEach(x=>x.classList.add('hidden'));screens[name].classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function pool(){const p=new Set();if(state.mode==='multiple'){for(let i=1;i<=12;i++)p.add(state.target*i);for(let i=0;i<45;i++)p.add(2+Math.floor(Math.random()*78))}else{for(let i=1;i<=state.target;i++)if(state.target%i===0)p.add(i);for(let i=0;i<30;i++)p.add(2+Math.floor(Math.random()*state.target+8))}return [...p].filter(n=>n>=1&&n<=80)}
function pickNumbers(){const p=pool(),good=p.filter(isCorrect),bad=p.filter(n=>!isCorrect(n));const nums=[good[Math.floor(Math.random()*good.length)]];if(Math.random()<.4&&good.length>1)nums.push(good.find(n=>n!==nums[0]));while(nums.length<4){const arr=bad.filter(n=>!nums.includes(n));if(!arr.length)break;nums.push(arr[Math.floor(Math.random()*arr.length)])}while(nums.length<4)nums.push(1+Math.floor(Math.random()*80));return nums.sort(()=>Math.random()-.5)}
function updateProgress(){$('#progressText').textContent=`ゴールまで あと${state.stepsLeft}`;$('#progressBar').style.width=`${(state.stepsTotal-state.stepsLeft)/state.stepsTotal*100}%`}
function renderTrail(){const t=$('#trail');t.innerHTML='';const cols=5,rows=5;const pos=(x,y)=>({left:`${10+x*20}%`,top:`${10+y*20}%`});for(let i=0;i<state.path.length;i++){const q=state.path[i],p=pos(q.x,q.y);const d=document.createElement('div');d.className='trail-dot'+(i===state.path.length-1?' current':'');d.style.left=p.left;d.style.top=p.top;t.appendChild(d);if(i){const a=state.path[i-1],dx=q.x-a.x,dy=q.y-a.y;const line=document.createElement('div');line.className='trail-line';line.style.left=pos(a.x,a.y).left;line.style.top=pos(a.x,a.y).top;line.style.width=(dx?20:0)+'%';line.style.height=(dy?8:0)+'px';if(dy){line.style.width='8px';line.style.height='20%';}if(dx<0)line.style.transform='translate(-100%,-50%)';else if(dy<0)line.style.transform='translate(-50%,-100%)';else line.style.transform='translate(-50%,-50%)';t.insertBefore(line,t.firstChild)}}}
function renderChoices(){const nums=pickNumbers(),dirs=['up','right','down','left'];dirs.forEach((d,i)=>{const b=$(`.choice.${d}`);b.disabled=false;b.classList.remove('empty','flash','wrong');b.textContent=nums[i];b.dataset.value=nums[i]});state.pending=false}
function startGame(mode){state.mode=mode;state.target=CONFIG[mode].targets[Math.floor(Math.random()*CONFIG[mode].targets.length)];state.stepsTotal=10;state.stepsLeft=10;state.correct=0;state.wrong=0;state.start=performance.now();state.char=CHARACTERS[Math.floor(Math.random()*CHARACTERS.length)];state.path=[{x:2,y:2}];$('#questionText').textContent=`${state.target}の${CONFIG[mode].label}を進もう！`,$('#characterName').textContent=state.char.name,$('#modeChip').textContent=CONFIG[mode].label,$('#feedback').textContent='お題に合う数字をタップしよう。';setNavi('waving');setFantasyBackground();updateProgress();renderTrail();showScreen('game');renderChoices()}
function handleChoice(btn){if(state.pending||btn.disabled)return;const value=Number(btn.dataset.value),dir=btn.dataset.direction;state.pending=true;if(isCorrect(value)){state.correct++;state.stepsLeft--;const last=state.path[state.path.length-1],delta={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];state.path.push({x:Math.max(0,Math.min(4,last.x+delta[0])),y:Math.max(0,Math.min(4,last.y+delta[1]))});renderTrail();updateProgress();btn.classList.add('flash');$('#feedback').textContent=`${value}は${state.target}の${CONFIG[state.mode].label}！ その道を進もう！`;$('#naviStage').className='navi-stage move-'+dir;setNavi(state.stepsLeft?'correct':'complete');$('#naviStage').classList.add('celebrate');setTimeout(()=>{if(state.stepsLeft<=0){finishGame();return}$('#naviStage').className='navi-stage';renderChoices()},300)}else{state.wrong++;btn.classList.add('wrong');setNavi('retry');$('#feedback').textContent='ここは行き止まり。ほかの道を見てみよう。';setTimeout(()=>{btn.classList.remove('wrong');state.pending=false},300)}}
function finishGame(){const sec=Math.max(1,Math.round((performance.now()-state.start)/100)/10);$('#correctCount').textContent=state.correct;$('#wrongCount').textContent=state.wrong;$('#timeCount').textContent=sec+'秒';$('#resultMessage').textContent=`${state.target}の${CONFIG[state.mode].label}を${state.correct}回見つけた！`;const key='bai-yaku-maze:'+state.mode+':clear',first=!localStorage.getItem(key);if(first)localStorage.setItem(key,'1');$('#badgeNote').innerHTML=first?`🏅 <span>${state.mode==='multiple'?'倍数迷路 はじめてクリア':'約数迷路 はじめてクリア'}</span> バッジをゲット！`:'🏅 クリアバッジ獲得ずみ！ つぎは自己ベストをねらおう。';showScreen('result')}
function goHome(){showScreen('home')}
$$('.mode-card').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.mode)));$$('.choice').forEach(b=>b.addEventListener('click',()=>handleChoice(b)));$('#againBtn').addEventListener('click',()=>startGame(state.mode));$('#resultHomeBtn').addEventListener('click',goHome);$('#homeBtn').addEventListener('click',goHome);$('#quitBtn').addEventListener('click',goHome);setNavi();
window.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowRight:'right',ArrowDown:'down',ArrowLeft:'left'};if(m[e.key]&&!screens.game.classList.contains('hidden'))$(`.choice.${m[e.key]}`).click()});
</script></body></html>
