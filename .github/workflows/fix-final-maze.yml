name: Fix final maze
on:
  push:
    paths:
      - '.github/workflows/fix-final-maze.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function choices(){\n  const dirs=['U','R','D','L'],correctDir=state.route[state.step+1].dir;\n  const correctIndex=dirs.indexOf(correctDir);\n  const used=new Set(),vals=Array(4);\n  const correct=getCorrectValue();\n  vals[correctIndex]=correct;used.add(correct);\n  for(let i=0;i<4;i++){\n    if(i===correctIndex)continue;\n    const d=getDistractor(used);used.add(d);vals[i]=d;\n  }\n  state.sceneCorrect=correct;\n  return dirs.map((dir,i)=>({dir,value:vals[i],ok:i===correctIndex}));\n}"""
          new="""function choices(){\n  const dirs=['U','R','D','L'],used=new Set(),vals=Array(4);\n  const correct=getCorrectValue(),correctIndex=rnd(0,3);\n  vals[correctIndex]=correct;used.add(correct);\n  for(let i=0;i<4;i++){\n    if(i===correctIndex)continue;\n    const d=getDistractor(used);used.add(d);vals[i]=d;\n  }\n  state.sceneCorrect=correct;\n  return dirs.map((dir,i)=>({dir,value:vals[i],ok:i===correctIndex}));\n}"""
          if old not in s: raise SystemExit('choices pattern not found')
          s=s.replace(old,new)
          old="""function newQuestion(){state.target=TARGETS[state.mode][rnd(0,TARGETS[state.mode].length-1)];$('question').textContent=state.target+' の'+(state.mode==='multiple'?'倍数':'約数')+'をさがそう';$('stepText').textContent=Math.min(state.step+1,12)+' / 12';$('progressBar').style.width=(state.step/12*100)+'%';const list=choices(),btns=[...document.querySelectorAll('.choice')];const map={U:btns[0],R:btns[1],D:btns[2],L:btns[3]};list.forEach(c=>{const b=map[c.dir];b.innerHTML='<span>'+c.value+'</span><small>'+({U:'上',R:'右',D:'下',L:'左'}[c.dir])+'</small>';b.dataset.value=c.value;b.dataset.ok=c.ok?'1':'0'})}"""
          new="""function chooseTarget(){const pool=TARGETS[state.mode];let next=pool[rnd(0,pool.length-1)];while(pool.length>1&&next===state.target)next=pool[rnd(0,pool.length-1)];state.target=next}\nfunction newQuestion(){$('question').textContent=state.target+' の'+(state.mode==='multiple'?'倍数':'約数')+'をさがそう';$('stepText').textContent=Math.min(state.step+1,12)+' / 12';$('progressBar').style.width=(state.step/12*100)+'%';const list=choices(),btns=[...document.querySelectorAll('.choice')];const map={U:btns[0],R:btns[1],D:btns[2],L:btns[3]};list.forEach(c=>{const b=map[c.dir];b.innerHTML='<span>'+c.value+'</span><small>'+({U:'上',R:'右',D:'下',L:'左'}[c.dir])+'</small>';b.dataset.value=c.value;b.dataset.ok=c.ok?'1':'0'})}"""
          if old not in s: raise SystemExit('newQuestion pattern not found')
          s=s.replace(old,new)
          s=s.replace("state.target=TARGETS[state.mode][0];$('start').classList.add('hidden')","state.target=null;chooseTarget();$('start').classList.add('hidden')")
          old="""if(ok){beep(true);state.correct++;state.step++;if(state.step>=12){finish();return}render()}else{beep(false);state.wrong++;$('reason').innerHTML='<strong>その数字は条件に合わないよ。</strong><br><span>もう一度、4つの数字から選んでみよう！</span>';updateStats();setTimeout(()=>{$('reason').innerHTML='<strong>数字を見て、正しい道を選ぼう。</strong><br><span>正解すると冒険ポイントが進みます。</span>'},1300)}}));"""
          new="""if(ok){beep(true);state.correct++;state.step++;if(state.step>=12){finish();return}if(state.step%4===0)chooseTarget();render()}else{beep(false);state.wrong++;$('reason').innerHTML='<strong>その数字は条件に合わないよ。</strong><br><span>もう一度、4つの数字から選んでみよう！</span>';updateStats();setTimeout(()=>{$('reason').innerHTML='<strong>数字を見て、正しい数字を選ぼう。</strong><br><span>正解すると次の冒険ポイントへ進みます。</span>'},1300)}}));"""
          if old not in s: raise SystemExit('click pattern not found')
          s=s.replace(old,new)
          s=s.replace('aria-label="上の道"','aria-label="上の数字"').replace('aria-label="右の道"','aria-label="右の数字"').replace('aria-label="下の道"','aria-label="下の数字"').replace('aria-label="左の道"','aria-label="左の数字"')
          # Keep the map visible and move all explanatory text outside the map.
          s=s.replace('<div class="gameHint">正しい数字を選ぼう。正解すると、ナビキャラとルートが先へ進むよ。</div><div class="mazeShell">','<div class="mazeShell">')
          s=s.replace('<div id="reason" class="reason"><strong>数字を見て、正しい数字を選ぼう。</strong><br><span>正解すると次の冒険ポイントへ進みます。</span></div>','')
          s=s.replace('<div class="bottom"><div class="hint" id="hint">ヒント：正しい数字を1つ選ぼう。</div>','<div class="bottom"><div class="hint" id="hint">4つの数字から、条件に合う数字を選ぼう。</div>')
          s=s.replace('.reason{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);width:min(700px,64%);z-index:10;background:#fffffff2;border:2px solid var(--line);border-radius:16px;padding:9px 13px;text-align:center;box-shadow:0 10px 24px #0003}.reason strong{font-size:13px}.reason span{font-size:12px;color:var(--muted);font-weight:800}', '.reason{display:none}')
          s=s.replace('.reason{width:68%}', '.reason{display:none}')
          s=s.replace('.reason{width:82%;bottom:10px;padding:8px}', '.reason{display:none}')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix four-question targets and map overlap' || exit 0
          git push
      - name: Remove patch workflow
        run: |
          git rm .github/workflows/fix-final-maze.yml
          git commit -m 'Remove temporary maze patch workflow'
          git push
