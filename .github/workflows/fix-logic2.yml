name: fix-logic2
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor == 'TT-sensei'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad="document.querySelector('.choice[data-dir=\"'+m[e.key']+'\"]')"
          good="document.querySelector('.choice[data-dir=\"'+m[e.key]+'\"]')"
          if bad not in s: raise SystemExit('syntax target not found')
          p.write_text(s.replace(bad,good),encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix keyboard shortcut syntax"
          git push
          git rm .github/workflows/fix-logic2.yml
          git commit -m "Remove one-time syntax fix workflow"
          git push
