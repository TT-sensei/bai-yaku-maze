name: fix-logic
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor == 'TT-sensei'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch math logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function good(n){return state.mode==='multiple'?n%state.target===0:state.target%n===0}
          function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min}
          function getDistractor(){let n;do{if(state.mode==='multiple')n=rnd(Math.max(2,state.target-2),Math.min(90,state.target*10+8));else n=rnd(2,state.target)}while(good(n)||n<=0);return n}
          function choices(){const dirs=['U','R','D','L'],correctDir=state.route[state.step+1].dir;let vals=[state.target*(rnd(1,Math.max(2,Math.floor(72/state.target)))),getDistractor(),getDistractor(),getDistractor()];let used=new Set();vals=vals.map(v=>{while(used.has(v)){v=getDistractor()}used.add(v);return v});for(let i=0;i<4;i++)if(dirs[i]===correctDir)state.sceneCorrect=vals[i];return dirs.map((d,i)=>({dir:d,value:vals[i],ok:d===correctDir||good(vals[i])&&d===correctDir})).sort(()=>Math.random()-.5)}"""
          new="""function good(n){if(!Number.isInteger(n)||n<=0)return false;return state.mode==='multiple'?n%state.target===0:state.target%n===0}
          function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min}
          function getCorrectValue(){
            if(state.mode==='multiple'){
              const maxMultiplier=Math.max(2,Math.floor(72/state.target));
              return state.target*rnd(1,maxMultiplier);
            }
            const divs=[];for(let n=1;n<=state.target;n++)if(state.target%n===0)divs.push(n);
            return divs[rnd(0,divs.length-1)];
          }
          function getDistractor(used){
            let n;
            do{
              n=state.mode==='multiple'?rnd(2,72):rnd(2,Math.max(12,state.target+10));
            }while(used.has(n)||good(n));
            return n;
          }
          function choices(){
            const dirs=['U','R','D','L'],correctDir=state.route[state.step+1].dir;
            const used=new Set(), vals=[];
            const correct=getCorrectValue();
            used.add(correct); vals.push(correct);
            while(vals.length<4){const d=getDistractor(used);used.add(d);vals.push(d)}
            const items=dirs.map((d,i)=>({dir:d,value:vals[i],ok:d===correctDir}));
            const correctIndex=dirs.indexOf(correctDir);
            [items[0],items[correctIndex]]=[items[correctIndex],items[0]];
            state.sceneCorrect=correct;
            return items;
          }"""
          if old not in s:
              raise SystemExit('target logic block not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit logic fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix multiple and divisor question logic"
          git push
          git rm .github/workflows/fix-logic.yml
          git commit -m "Remove one-time logic fix workflow"
          git push
