name: Apply maze UI tweak

on:
  push:
    paths:
      - '.github/workflows/ui-tweak.yml'

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tweak UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          override = '''
          /* UI refinement: keep the game entrance primary, reduce numbers/character, add maze atmosphere */
          .startart{min-height:330px}
          .navi{height:min(300px,40vh);max-width:68%}
          .portal{width:min(32vw,340px);box-shadow:0 0 55px #50d69722}
          .choice{width:min(14vw,170px);height:min(14vw,170px);min-width:108px;min-height:108px;font-size:clamp(30px,3.7vw,50px);border-radius:22px;box-shadow:0 8px 0 #aacdbd,0 14px 24px #12382a2b}
          .maze{background:linear-gradient(145deg,#4b8b69,#244d3b);box-shadow:inset 0 0 0 2px #ffffff18,inset 0 0 70px #071a1255}
          .maze:before{content:"";position:absolute;inset:0;z-index:0;opacity:.25;background:repeating-linear-gradient(0deg,transparent 0 38px,#d9f4e622 39px 41px),repeating-linear-gradient(90deg,transparent 0 38px,#d9f4e622 39px 41px);pointer-events:none}
          .maze:after{content:"";position:absolute;inset:3%;z-index:0;border:18px solid #163d2d22;border-radius:30px;box-shadow:inset 0 0 0 3px #ffffff16;pointer-events:none}
          @media(max-width:900px){.startart{min-height:220px}.navi{height:210px}.choice{width:24%;height:24%;min-width:96px;min-height:96px;font-size:clamp(27px,4vw,43px)}}
          @media(max-width:560px){.startart{min-height:175px}.navi{height:165px}.choice{width:68px;height:68px;min-width:68px;min-height:68px;font-size:28px}}
          '''
          marker='</style>'
          if marker not in s: raise SystemExit('style end not found')
          s=s.replace(marker, override+'\n'+marker, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refine maze visual balance'
          git push

# trigger v3
