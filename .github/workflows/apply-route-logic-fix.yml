name: apply-route-logic-fix
on:
  push:
    paths:
      - 'scripts/fix-route-logic.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python scripts/fix-route-logic.py
      - name: Commit
        run: |
          rm -f scripts/fix-route-logic.py .github/workflows/apply-route-logic-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/fix-route-logic.py .github/workflows/apply-route-logic-fix.yml
          git commit -m 'fix: separate choices from route direction'
          git push
